<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cup Shuffle AR - A-Frame</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 18px;
            z-index: 999;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 30px;
            border-radius: 15px;
        }

        #scan-hint {
            position: fixed;
            bottom: 80px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            z-index: 999;
            pointer-events: none;
            text-shadow: 0 1px 3px black;
            display: none;
        }
    </style>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- MindAR for A-Frame -->
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/dist/mindar-image.prod.js"></script>
    <base target="_blank">
</head>

<body>
    <div id="loading">Loading AR...<br>Please wait</div>
    <div id="scan-hint">📷 Point camera at the marker</div>

    <!-- A-Frame Scene with MindAR -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
        embedded color-space="sRGB" renderer="antialias: true; alpha: true; colorManagement: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <!-- Camera & Cursor Fix -->
        <a-camera position="0 0 0" look-controls="enabled: false">
            <a-cursor raycaster="objects: .cup" fuse="false" color="white"></a-cursor>
        </a-camera>

        <!-- Lighting -->
        <a-light type="directional" position="1 2 3" intensity="1"></a-light>
        <a-light type="ambient" intensity="0.6"></a-light>

        <!-- Image Target Anchor -->
        <a-entity id="targetAnchor" mindar-image-target="targetIndex: 0" position="0 0 0">

            <!-- Cups Container -->
            <a-entity id="cupsContainer">
                <!-- 3 Cups -->
                <a-cone id="cup0" class="cup" color="#ff3333" radius-bottom="0.08" radius-top="0.08" height="0.12"
                    position="-0.2 0.06 0" data-id="0">
                </a-cone>

                <a-cone id="cup1" class="cup" color="#33ff33" radius-bottom="0.08" radius-top="0.08" height="0.12"
                    position="0 0.06 0" data-id="1">
                </a-cone>

                <a-cone id="cup2" class="cup" color="#3333ff" radius-bottom="0.08" radius-top="0.08" height="0.12"
                    position="0.2 0.06 0" data-id="2">
                </a-cone>
            </a-entity>

            <!-- Ball -->
            <a-sphere id="ball" color="#ffff00" radius="0.05" position="0 0 0" visible="false">
            </a-sphere>
        </a-entity>
    </a-scene>

    <script>
        // ============================================
        // FLUTTER BRIDGE (flutter_inappwebview)
        // ============================================
        window.receiveFromFlutter = function (command, data) {
            console.log('Flutter says:', command, data);
            switch (command) {
                case 'startGame': startGame(); break;
                case 'shuffle': startShuffle(); break;
                case 'reset': resetGame(); break;
                case 'reveal': revealCup(data.index); break;
            }
        };

        function sendToFlutter(event, data) {
            if (window.FlutterApp && window.FlutterApp.postMessage) {
                window.FlutterApp.postMessage(JSON.stringify({ event: event, data: data || {} }));
            }
        }
        // ============================================
        // GAME STATE
        // ============================================
        let gameState = {
            isReady: false,
            isPlaced: false,
            isShuffling: false,
            isRevealed: false,
            ballIndex: -1,
            cups: [],
            ball: null,
            positions: [-0.2, 0, 0.2]
        };

        // ============================================
        // WAIT FOR SCENE TO LOAD
        // ============================================
        const scene = document.querySelector('a-scene');
        const targetAnchor = document.querySelector('#targetAnchor');
        const cups = document.querySelectorAll('.cup');
        const ball = document.querySelector('#ball');
        const loadingDiv = document.querySelector('#loading');
        const scanHint = document.querySelector('#scan-hint');

        scene.addEventListener('loaded', () => {
            console.log('Scene loaded');

            gameState.cups = Array.from(cups);
            gameState.ball = ball;

            scene.addEventListener('arReady', () => {
                console.log('AR Ready');
                loadingDiv.style.display = 'none';
                gameState.isReady = true;
                sendToFlutter('arReady', {});
            });

            scene.addEventListener('arError', (e) => {
                console.error('AR Error:', e.detail);
                loadingDiv.textContent = 'AR Error: ' + (e.detail.message || 'Unknown');
                sendToFlutter('arError', { message: e.detail.message });
            });
        });

        // ============================================
        // TARGET EVENTS
        // ============================================
        targetAnchor.addEventListener('targetFound', () => {
            console.log('Target Found');
            scanHint.style.display = 'none';
        });

        targetAnchor.addEventListener('targetLost', () => {
            console.log('Target Lost');
            scanHint.style.display = 'block';
        });

        // ============================================
        // GAME FUNCTIONS
        // ============================================

        function startGame() {
            gameState.isPlaced = true;
            gameState.isRevealed = false;

            gameState.cups.forEach((cup, i) => {
                cup.setAttribute('position', `${gameState.positions[i]} 0.06 0`);
            });

            gameState.ballIndex = Math.floor(Math.random() * 3);

            ball.setAttribute('position', `${gameState.positions[gameState.ballIndex]} 0 0`);
            ball.setAttribute('visible', 'true');

            setTimeout(() => {
                ball.setAttribute('visible', 'false');
                sendToFlutter('gamePlaced', { ballIndex: gameState.ballIndex });
            }, 1200);
        }

        function startShuffle() {
            if (!gameState.isPlaced || gameState.isShuffling || gameState.isRevealed) return;
            gameState.isShuffling = true;

            let swaps = 0;
            const maxSwaps = 5;

            function doSwap() {
                if (swaps >= maxSwaps) {
                    gameState.isShuffling = false;
                    sendToFlutter('shuffleComplete', {});
                    return;
                }

                let a = Math.floor(Math.random() * 3);
                let b = Math.floor(Math.random() * 3);
                while (a === b) b = Math.floor(Math.random() * 3);

                const posA = gameState.cups[a].getAttribute('position');
                const posB = gameState.cups[b].getAttribute('position');

                gameState.cups[a].setAttribute('animation__pos', {
                    property: 'position',
                    to: `${posB.x} ${posB.y} ${posB.z}`,
                    dur: 400,
                    easing: 'easeInOutQuad'
                });

                gameState.cups[b].setAttribute('animation__pos', {
                    property: 'position',
                    to: `${posA.x} ${posA.y} ${posA.z}`,
                    dur: 400,
                    easing: 'easeInOutQuad'
                });

                [gameState.positions[a], gameState.positions[b]] =
                    [gameState.positions[b], gameState.positions[a]];

                if (gameState.ballIndex === a) gameState.ballIndex = b;
                else if (gameState.ballIndex === b) gameState.ballIndex = a;

                swaps++;
                setTimeout(doSwap, 600);
            }

            doSwap();
        }

        function revealCup(index) {
            if (gameState.isShuffling || !gameState.isPlaced || gameState.isRevealed) return;
            gameState.isRevealed = true;

            const cup = gameState.cups[index];
            const isCorrect = (index === gameState.ballIndex);
            const pos = cup.getAttribute('position');

            cup.setAttribute('animation__lift', {
                property: 'position',
                to: `${pos.x} 0.3 ${pos.z}`,
                dur: 500,
                easing: 'easeOutQuad'
            });

            setTimeout(() => {
                if (isCorrect) {
                    ball.setAttribute('position', `${gameState.positions[gameState.ballIndex]} 0 0`);
                    ball.setAttribute('visible', 'true');
                } else {
                    setTimeout(() => {
                        const correctCup = gameState.cups[gameState.ballIndex];
                        const correctPos = correctCup.getAttribute('position');
                        correctCup.setAttribute('animation__lift2', {
                            property: 'position',
                            to: `${correctPos.x} 0.3 ${correctPos.z}`,
                            dur: 500,
                            easing: 'easeOutQuad'
                        });
                        ball.setAttribute('position', `${gameState.positions[gameState.ballIndex]} 0 0`);
                        ball.setAttribute('visible', 'true');
                    }, 1000);
                }

                sendToFlutter('cupRevealed', {
                    index: index,
                    isCorrect: isCorrect,
                    ballIndex: gameState.ballIndex
                });
            }, 550);
        }

        function resetGame() {
            gameState.isPlaced = false;
            gameState.isShuffling = false;
            gameState.isRevealed = false;
            gameState.ballIndex = -1;

            gameState.positions = [-0.2, 0, 0.2];
            gameState.cups.forEach((cup, i) => {
                cup.setAttribute('position', `${gameState.positions[i]} 0.06 0`);
                cup.removeAttribute('animation__lift');
                cup.removeAttribute('animation__lift2');
            });

            ball.setAttribute('visible', 'false');
            sendToFlutter('gameReset', {});
        }

        // ============================================
        // TAP DETECTION
        // ============================================
        cups.forEach(cup => {
            cup.addEventListener('click', () => {
                if (!gameState.isPlaced || gameState.isShuffling || gameState.isRevealed) return;
                const cupIndex = parseInt(cup.getAttribute('data-id'));
                console.log('Cup tapped:', cupIndex);
                sendToFlutter('cupTapped', { index: cupIndex });
            });
        });
    </script>
</body>

</html>
