<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js" type="module"></script>
    <style>
        body {
            margin: 0;
        }

        .example-container {
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="status">Status: starting…</div>
    <div class="example-container">
        <a-scene
            mindar-image="imageTargetSrc: ./targets2.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
            embedded color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights, shadowMap.enabled: true"
            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

            <a-assets>
                <a-asset-item id="cupModel" src="./cup.glb"></a-asset-item>
                <a-asset-item id="ballModel" src="./gem.glb"></a-asset-item>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity light="type: ambient; intensity: 0.6"></a-entity>
            <a-entity light="type: directional; intensity: 1.2; castShadow: true;
        shadowCameraLeft: -1; shadowCameraRight: 1; shadowCameraTop: 1; shadowCameraBottom: -1;"
                position="1 2 2"></a-entity>

            <a-entity id="targetAnchor" mindar-image-target="targetIndex: 0">
                <a-plane rotation="-90 0 0" position="0 0 0" width="1.4" height="0.7"
                    material="shader: shadow; opacity: 0.5" shadow="receive: true"></a-plane>

                <a-entity id="cupsContainer">
                    <a-entity id="cup0" class="cup" data-id="0" position="-0.4 0.06 0" shadow="cast: true">
                        <a-entity gltf-model="#cupModel" rotation="180 0 0" scale="0.04 0.04 0.04"
                            position="0 0.06 0"></a-entity>
                    </a-entity>
                    <a-entity id="cup1" class="cup" data-id="1" position="0 0.06 0" shadow="cast: true">
                        <a-entity gltf-model="#cupModel" rotation="180 0 0" scale="0.04 0.04 0.04"
                            position="0 0.06 0"></a-entity>
                    </a-entity>
                    <a-entity id="cup2" class="cup" data-id="2" position="0.4 0.06 0" shadow="cast: true">
                        <a-entity gltf-model="#cupModel" rotation="180 0 0" scale="0.04 0.04 0.04"
                            position="0 0.06 0"></a-entity>
                    </a-entity>
                    <a-entity id="cup3" class="cup" data-id="3" position="0.6 0.06 0" visible="false"
                        shadow="cast: true">
                        <a-entity gltf-model="#cupModel" rotation="180 0 0" scale="0.04 0.04 0.04"
                            position="0 0.06 0"></a-entity>
                    </a-entity>
                    <a-entity id="cup4" class="cup" data-id="4" position="-0.6 0.06 0" visible="false"
                        shadow="cast: true">
                        <a-entity gltf-model="#cupModel" rotation="180 0 0" scale="0.04 0.04 0.04"
                            position="0 0.06 0"></a-entity>
                    </a-entity>
                </a-entity>

                <a-entity id="ballContainer" visible="false">
                    <a-entity id="ball" gltf-model="#ballModel" scale="0.2 0.2 0.2" position="0 -0.045 0"
                        shadow="cast: true"></a-entity>
                </a-entity>
            </a-entity>
        </a-scene>
    </div>

    <script>
        // ============ 1) LOGIC ============
        const SPACING = 0.4;
        const CUP_Y = 0.06;
        const LIFT_Y = 0.3;
        const BALL_Y = 0.0;

        function computeSlots(count) {
            const slots = [];
            const start = -((count - 1) * SPACING) / 2;
            for (let i = 0; i < count; i++) slots.push(+(start + i * SPACING).toFixed(2));
            return slots;
        }

        const Logic = {
            create(cups) {
                return {
                    cups: cups,
                    attempts: 0,
                    intro: false,
                    placed: false, shuffling: false, revealed: false,
                    ballIndex: -1,
                    positions: computeSlots(cups),
                    guessed: new Array(cups).fill(false),
                };
            },
            place(s) {
                s.placed = true; s.revealed = false;
                s.attempts = 0;
                s.positions = computeSlots(s.cups);
                s.guessed = new Array(s.cups).fill(false);
                s.ballIndex = Math.floor(Math.random() * s.cups);
                return s.ballIndex;
            },
            randomSwap(s) {
                let a = Math.floor(Math.random() * s.cups);
                let b = Math.floor(Math.random() * s.cups);
                while (a === b) b = Math.floor(Math.random() * s.cups);
                [s.positions[a], s.positions[b]] = [s.positions[b], s.positions[a]];
                return { a, b };
            },
            canGuess(s, i) { return s.placed && !s.shuffling && !s.revealed && !s.guessed[i]; },
            guess(s, i) {
                s.guessed[i] = true;
                const correct = (i === s.ballIndex);
                if (correct) s.revealed = true;
                return correct;
            },
        };

        // ============ 2) VIEW ============
        const View = {
            cups: [], ball: null,
            init() {
                this.cups = Array.from(document.querySelectorAll('.cup'));
                this.ball = document.querySelector('#ballContainer');
            },
            setActive(count) {
                this.cups.forEach((c, i) => c.setAttribute('visible', i < count ? 'true' : 'false'));
            },
            placeCup(i, x) { this.cups[i].setAttribute('position', x + ' ' + CUP_Y + ' 0'); },
            swapCups(a, b, xa, xb) {
                this.cups[a].setAttribute('animation__pos', { property: 'position', to: xa + ' ' + CUP_Y + ' 0', dur: 400, easing: 'easeInOutQuad' });
                this.cups[b].setAttribute('animation__pos', { property: 'position', to: xb + ' ' + CUP_Y + ' 0', dur: 400, easing: 'easeInOutQuad' });
            },
            liftCup(i, x) {
                this.cups[i].removeAttribute('animation__lower');
                this.cups[i].setAttribute('animation__lift', { property: 'position', to: x + ' ' + LIFT_Y + ' 0', dur: 500, easing: 'easeOutQuad' });
            },

            lowerCup(i, x) {
                this.cups[i].removeAttribute('animation__lift');
                this.cups[i].setAttribute('animation__lower', { property: 'position', to: x + ' ' + CUP_Y + ' 0', dur: 400, easing: 'easeInQuad' });
            },
            clearAnimations() {
                this.cups.forEach(c => {
                    c.removeAttribute('animation__lift');
                    c.removeAttribute('animation__lower');
                    c.removeAttribute('animation__pos');
                });
            },
            showBall(x) { this.ball.setAttribute('position', x + ' ' + BALL_Y + ' 0'); this.ball.setAttribute('visible', 'true'); },
            hideBall() { this.ball.setAttribute('visible', 'false'); },
            lowerAll(positions) {
                positions.forEach((x, i) => {
                    this.cups[i].removeAttribute('animation__lift');
                    this.cups[i].removeAttribute('animation__pos');
                    this.placeCup(i, x);
                });
                this.hideBall();
            },
        };

        // ============ 3) BRIDGE ============
        const Bridge = {
            send(event, data) {
                if (window.FlutterApp && window.FlutterApp.postMessage) {
                    window.FlutterApp.postMessage(JSON.stringify({ event, data: data || {} }));
                }
            },
        };

        // ============ 4) CONTROLLER ============
        let S = Logic.create(3);
        const statusDiv = document.getElementById('status');
        const setStatus = (t) => { statusDiv.textContent = 'Status: ' + t; console.log('[STATUS] ' + t); };

        window.receiveFromFlutter = function (command, data) {
            switch (command) {
                case 'startGame': {
                    const cups = (data && data.cups) ? data.cups : 3;
                    S = Logic.create(cups);

                    View.setActive(cups);
                    const ballIndex = Logic.place(S);
                    View.clearAnimations();
                    S.positions.forEach((x, i) => View.placeCup(i, x));
                    View.showBall(S.positions[ballIndex]);

                    S.intro = true;   // ✅ الإصلاح 3: قفل
                    View.liftCup(ballIndex, S.positions[ballIndex]);
                    setStatus('Look! The ball is here');

                    setTimeout(() => {
                        View.lowerCup(ballIndex, S.positions[ballIndex]);
                        setTimeout(() => {
                            View.hideBall();
                            S.intro = false;   // ✅ الإصلاح 3: فتح القفل
                            Bridge.send('gamePlaced', { ballIndex });
                        }, 450);
                    }, 2000);
                    break;
                }
                case 'shuffle': {
                    // ✅ الإصلاح 3: شرط S.intro
                    if (!S.placed || S.shuffling || S.revealed || S.intro) return;
                    S.shuffling = true;
                    const maxSwaps = (data && data.count) ? data.count : 5;
                    let swaps = 0;
                    (function step() {
                        if (swaps >= maxSwaps) { S.shuffling = false; Bridge.send('shuffleComplete'); setStatus('Pick a cup!'); return; }
                        const { a, b } = Logic.randomSwap(S);
                        View.swapCups(a, b, S.positions[a], S.positions[b]);
                        swaps++;
                        setTimeout(step, 600);
                    })();
                    break;
                }
                case 'reset': {
                    const c = S.cups;
                    S = Logic.create(c);
                    View.lowerAll(S.positions);
                    setStatus('Reset');
                    break;
                }
                case 'reveal': handleGuess(data.index); break;
            }
        };

        function handleGuess(i) {
            if (!Logic.canGuess(S, i)) return;
            const correct = Logic.guess(S, i);
            View.clearAnimations();
            View.liftCup(i, S.positions[i]);
            const x = S.positions[i];
            const posName = x < -0.07 ? 'left' : (x > 0.07 ? 'right' : 'center');
            S.attempts++;
            if (correct) {
                setTimeout(() => View.showBall(S.positions[S.ballIndex]), 400);
                Bridge.send('cupRevealed', { index: i, isCorrect: true, attempt: S.attempts, ballIndex: S.ballIndex, position: posName });
                setStatus('Correct!');
            } else {
                S.revealed = true;
                Bridge.send('cupRevealed', { index: i, isCorrect: false, attempt: S.attempts, finalFail: true, ballIndex: S.ballIndex, position: posName });
                setStatus('Wrong!');
            }
        }

        // ============ Tap input + Event listeners ============
        const sceneEl = document.querySelector('a-scene');

        // ✅ لازم نستنى الـ scene تتحمل قبل ما نستخدم canvas
        sceneEl.addEventListener('loaded', () => {
            console.log('[JS] Scene loaded, initializing...');
            View.init();

            sceneEl.canvas.addEventListener('click', (e) => {
                const rect = sceneEl.canvas.getBoundingClientRect();
                const pointer = new AFRAME.THREE.Vector2(
                    ((e.clientX - rect.left) / rect.width) * 2 - 1,
                    -((e.clientY - rect.top) / rect.height) * 2 + 1
                );
                const ray = new AFRAME.THREE.Raycaster();
                ray.setFromCamera(pointer, sceneEl.camera);
                const activeCups = View.cups.filter((c, i) => i < S.cups);
                const hits = ray.intersectObjects(activeCups.map(c => c.object3D), true);

                if (hits.length) {
                    let obj = hits[0].object;
                    while (obj && !(obj.el && obj.el.classList.contains('cup'))) obj = obj.parent;

                    if (obj) {
                        const cupIndex = parseInt(obj.el.getAttribute('data-id'));

                        if (!Logic.canGuess(S, cupIndex)) return;
                        Bridge.send('cupTapped', { index: cupIndex });
                        setStatus('Cup selected...');
                    }
                }
            });

            console.log('[JS] Tap listener registered, waiting for arReady...');
        });

        sceneEl.addEventListener('arReady', () => {
            console.log('[JS] arReady fired, sending to Flutter');
            setStatus('AR Ready');
            Bridge.send('arReady');
        });

        sceneEl.addEventListener('arError', () => {
            console.log('[JS] arError fired');
            setStatus('AR Error');
            Bridge.send('arError', { message: 'AR Error' });
        });

        console.log('[JS] Top-level listeners registered');
    </script>
</body>

</html>
