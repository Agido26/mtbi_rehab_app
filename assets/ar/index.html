<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cup Shuffle AR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #ar-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div id="ar-container">
        <div class="loading" id="loading">Loading AR...</div>
        <!-- MindAR will inject canvas/video here -->
    </div>

    <!-- Load your MindAR min file -->
    <script src="./mindar-image.min.js"></script>
    <!-- Or whatever your file is named -->

    <!-- Three.js (usually required by MindAR) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        // Bridge to Flutter
        const FlutterApp = {
            postMessage: function (msg) {
                if (window.FlutterApp && window.FlutterApp.postMessage) {
                    window.FlutterApp.postMessage(JSON.stringify(msg));
                }
            }
        };

        // Receive commands from Flutter
        window.receiveFromFlutter = function (command, data) {
            console.log('From Flutter:', command, data);

            switch (command) {
                case 'startGame':
                    startCupShuffle();
                    break;
                case 'shuffle':
                    performShuffle();
                    break;
                case 'reset':
                    resetGame();
                    break;
                case 'reveal':
                    revealCup(data.index);
                    break;
            }
        };

        // Send events back to Flutter
        function sendToFlutter(event, data) {
            FlutterApp.postMessage({ event: event, data: data });
        }

        // Game state
        let gameState = {
            isReady: false,
            isPlaced: false,
            isShuffling: false,
            score: 0,
            ballIndex: -1
        };

        // Initialize MindAR here
        async function initAR() {
            try {
                // TODO: Initialize your MindAR instance here
                // Example:
                // const mindarThree = new MindARThree({
                //     container: document.querySelector('#ar-container'),
                //     imageTargetSrc: './targets.mind'
                // });

                document.getElementById('loading').style.display = 'none';
                gameState.isReady = true;
                sendToFlutter('arReady', {});

            } catch (e) {
                console.error('AR Init failed:', e);
                sendToFlutter('arError', { message: e.message });
            }
        }

        function startCupShuffle() {
            // TODO: Place cups in AR scene
            gameState.isPlaced = true;
            gameState.ballIndex = Math.floor(Math.random() * 3);
            sendToFlutter('gamePlaced', { ballIndex: gameState.ballIndex });
        }

        function performShuffle() {
            if (!gameState.isPlaced || gameState.isShuffling) return;
            gameState.isShuffling = true;

            // TODO: Animate cup shuffling in MindAR/Three.js

            setTimeout(() => {
                gameState.isShuffling = false;
                sendToFlutter('shuffleComplete', {});
            }, 2000);
        }

        function resetGame() {
            // TODO: Remove all AR nodes
            gameState.isPlaced = false;
            gameState.isShuffling = false;
            sendToFlutter('gameReset', {});
        }

        function revealCup(index) {
            // TODO: Lift cup in AR, show ball if correct
            const isCorrect = index === gameState.ballIndex;
            sendToFlutter('cupRevealed', {
                index: index,
                isCorrect: isCorrect,
                ballIndex: gameState.ballIndex
            });
        }

        // Handle cup taps in AR
        function onCupTapped(cupIndex) {
            if (gameState.isShuffling || !gameState.isPlaced) return;
            sendToFlutter('cupTapped', { index: cupIndex });
        }

        // Start initialization when page loads
        window.addEventListener('load', initAR);
    </script>
</body>

</html>
