<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js" type="module"></script>

    <style>
        body {
            margin: 0;
        }

        .example-container {
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="status">Status: starting…</div>

    <div class="example-container">
        <a-scene
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
            embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.1" width="0.3" height="0.3" depth="0.3" color="#4CC3D9"></a-box>
            </a-entity>
        </a-scene>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const scene = document.querySelector('a-scene');
        const target = document.querySelector('[mindar-image-target]');

        scene.addEventListener('loaded', () => { statusDiv.textContent = 'Status: Scene loaded ✓'; });
        scene.addEventListener('arReady', () => { statusDiv.textContent = 'Status: AR Ready ✓ وجّه الكاميرا'; });
        scene.addEventListener('arError', () => { statusDiv.textContent = 'Status: AR Error'; });
        target.addEventListener('targetFound', () => { statusDiv.textContent = 'Status: 🎯 TARGET FOUND'; });
        target.addEventListener('targetLost', () => { statusDiv.textContent = 'Status: Target lost'; });
    </script>
</body>

</html>
