<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js" type="module"></script>
    <style>
        body {
            margin: 0;
        }

        .example-container {
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            font-family: sans-serif;
            font-size: 14px;
        }

        /* Silhouettes at top of screen (fixed, not tracked) */
        #silhouettes {
            position: fixed;
            top: 16px;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 24px;
            pointer-events: none;
        }

        .silhouette {
            width: 44px;
            height: 44px;
            background: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .silhouette.circle {
            border-radius: 50%;
        }

        .silhouette.star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
                    50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            border-radius: 0;
        }

        .silhouette.triangle {
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            border-radius: 0;
        }

        .silhouette.heart {
            clip-path: polygon(50% 85%, 15% 50%, 5% 30%, 15% 10%, 35% 10%,
                    50% 30%, 65% 10%, 85% 10%, 95% 30%, 85% 50%);
            border-radius: 0;
        }

        .silhouette.square {
            border-radius: 6px;
        }
    </style>
</head>


<body>
    <div id="status">Status: starting…</div>
    <div id="silhouettes"></div>
    <div class="example-container">
        <a-scene
            mindar-image="imageTargetSrc: ./shapematch_markers.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
            embedded color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights, shadowMap.enabled: true"
            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity light="type: ambient; intensity: 0.6"></a-entity>
            <a-entity light="type: directional; intensity: 1.2; castShadow: true;
                shadowCameraLeft: -2; shadowCameraRight: 2;
                shadowCameraTop: 2; shadowCameraBottom: -2;" position="1 2 2"></a-entity>

            <!-- 5 targets: one per card -->
            <a-entity id="target0" mindar-image-target="targetIndex: 0">
                <a-entity id="shape0" class="shape-marker" data-target-index="0" visible="false"></a-entity>
            </a-entity>
            <a-entity id="target1" mindar-image-target="targetIndex: 1">
                <a-entity id="shape1" class="shape-marker" data-target-index="1" visible="false"></a-entity>
            </a-entity>
            <a-entity id="target2" mindar-image-target="targetIndex: 2">
                <a-entity id="shape2" class="shape-marker" data-target-index="2" visible="false"></a-entity>
            </a-entity>
            <a-entity id="target3" mindar-image-target="targetIndex: 3">
                <a-entity id="shape3" class="shape-marker" data-target-index="3" visible="false"></a-entity>
            </a-entity>
            <a-entity id="target4" mindar-image-target="targetIndex: 4">
                <a-entity id="shape4" class="shape-marker" data-target-index="4" visible="false"></a-entity>
            </a-entity>
        </a-scene>
    </div>

    <script>
        // ====== CONFIG ======
        // Matches kAllShapeIds in Flutter — index = targetIndex
        const SHAPE_DEFS = [
            { id: 'circle', type: 'sphere', color: '#E53935' },
            { id: 'star', type: 'star', color: '#FDD835' },
            { id: 'triangle', type: 'triangle', color: '#43A047' },
            { id: 'heart', type: 'heart', color: '#E91E63' },
            { id: 'square', type: 'box', color: '#1E88E5' },
        ];

        const Bridge = {
            send(event, data) {
                if (window.FlutterApp && window.FlutterApp.postMessage) {
                    window.FlutterApp.postMessage(JSON.stringify({ event, data: data || {} }));
                }
            },
        };

        const setStatus = (t) => {
            document.getElementById('status').textContent = 'Status: ' + t;
            console.log('[STATUS] ' + t);
        };

        // ====== SHAPE BUILDERS (painted primitives — later we can swap to GLB) ======
        function buildShape(def) {
            const el = document.createElement('a-entity');
            switch (def.type) {
                case 'sphere':
                    el.innerHTML = `<a-sphere radius="0.06" color="${def.color}" shadow="cast: true"></a-sphere>`;
                    break;
                case 'box':
                    el.innerHTML = `<a-box width="0.1" height="0.1" depth="0.02" color="${def.color}" shadow="cast: true"></a-box>`;
                    break;
                case 'triangle':
                    // Use cylinder + rotation as cheap triangle stand-in
                    el.innerHTML = `
                        <a-cone radius-bottom="0.07" radius-top="0" height="0.12"
                            color="${def.color}" shadow="cast: true"></a-cone>`;
                    break;
                case 'star':
                    // Use two crossed boxes to hint at star (replace with GLB later)
                    el.innerHTML = `
                        <a-box width="0.12" height="0.025" depth="0.02" color="${def.color}" shadow="cast: true"></a-box>
                        <a-box width="0.12" height="0.025" depth="0.02" color="${def.color}" rotation="0 0 60" shadow="cast: true"></a-box>
                        <a-box width="0.12" height="0.025" depth="0.02" color="${def.color}" rotation="0 0 120" shadow="cast: true"></a-box>`;
                    break;
                case 'heart':
                    // Two spheres + a cone = cheap heart (replace with GLB later)
                    el.innerHTML = `
                        <a-sphere radius="0.04" color="${def.color}" position="-0.03 0.02 0" shadow="cast: true"></a-sphere>
                        <a-sphere radius="0.04" color="${def.color}" position="0.03 0.02 0" shadow="cast: true"></a-sphere>
                        <a-cone radius-bottom="0.055" radius-top="0" height="0.09"
                            rotation="0 0 180" color="${def.color}" position="0 -0.03 0" shadow="cast: true"></a-cone>`;
                    break;
            }
            el.setAttribute('position', '0 0.12 0');
            return el;
        }

        // ====== STATE ======
        let S = {
            activeShapeIds: [],    // shapeIds for current round (e.g. ['star','circle','triangle'])
            correctOrder: [],      // targetIndices in correct order, e.g. [1,0,2]
            showing: false,
        };
        const sceneEl = document.querySelector('a-scene');
        const tracked = { 0: false, 1: false, 2: false, 3: false, 4: false };
        for (let i = 0; i < 5; i++) {
            const t = document.getElementById('target' + i);
            t.addEventListener('targetFound', () => { tracked[i] = true; });
            t.addEventListener('targetLost', () => { tracked[i] = false; });
        }
        // ====== HELPERS ======
        function renderSilhouettes(shapeIds) {
            const container = document.getElementById('silhouettes');
            container.innerHTML = '';
            shapeIds.forEach(id => {
                const div = document.createElement('div');
                div.className = 'silhouette ' + id;
                container.appendChild(div);
            });
        }

        function showShapesOnCards(durationSec) {
            S.showing = true;
            S.correctOrder.forEach(targetIdx => {
                const marker = document.getElementById('shape' + targetIdx);
                marker.setAttribute('visible', 'true');
            });
            setTimeout(() => {
                S.correctOrder.forEach(targetIdx => {
                    document.getElementById('shape' + targetIdx).setAttribute('visible', 'false');
                });
                S.showing = false;
                Bridge.send('peekEnded');
            }, durationSec * 1000);
        }

        function hideAllShapes() {
            for (let i = 0; i < 5; i++) {
                document.getElementById('shape' + i).setAttribute('visible', 'false');
            }
        }

        function collectCardPositions() {
            // Returns: [{targetIndex, worldX, detected}] sorted by X
            const results = [];
            for (let i = 0; i < 5; i++) {
                const target = document.getElementById('target' + i);
                const isActive = S.correctOrder.includes(i);
                if (!isActive) continue;

                if (tracked[i]) {
                    const worldPos = new THREE.Vector3();
                    target.object3D.getWorldPosition(worldPos);
                    results.push({ targetIndex: i, worldX: worldPos.x, detected: true });
                } else {
                    results.push({ targetIndex: i, worldX: null, detected: false });
                }
            }
            return results;
        }

        // ====== COMMANDS FROM FLUTTER ======
        window.receiveFromFlutter = function (command, data) {
            switch (command) {
                case 'startRound': {
                    // data = { shapeIds: ['star','circle',...], correctOrder: [1,0,...] }
                    S.activeShapeIds = data.shapeIds;
                    S.correctOrder = data.correctOrder;

                    // Reset all markers
                    hideAllShapes();
                    for (let i = 0; i < 5; i++) {
                        const marker = document.getElementById('shape' + i);
                        marker.innerHTML = '';
                    }
                    // Build shape meshes for active cards
                    S.correctOrder.forEach(targetIdx => {
                        const marker = document.getElementById('shape' + targetIdx);
                        const shapeId = SHAPE_DEFS[targetIdx].id;
                        if (S.activeShapeIds.includes(shapeId)) {
                            const def = SHAPE_DEFS[targetIdx];
                            const built = buildShape(def);
                            marker.appendChild(built);
                        }
                    });
                    renderSilhouettes(S.activeShapeIds);
                    setStatus('Round ready. Press Show.');
                    Bridge.send('roundReady');
                    break;
                }

                case 'showPeek': {
                    const duration = data.durationSeconds || 4;
                    showShapesOnCards(duration);
                    setStatus('Look! Shapes revealed...');
                    break;
                }

                case 'check': {
                    const cards = collectCardPositions();
                    const allDetected = cards.every(c => c.detected);
                    if (!allDetected) {
                        Bridge.send('checkResult', { allDetected: false });
                        setStatus('Move back — show all cards to camera');
                        return;
                    }
                    // Sort by worldX (left to right)
                    cards.sort((a, b) => a.worldX - b.worldX);
                    const patientOrder = cards.map(c => c.targetIndex);
                    Bridge.send('checkResult', {
                        allDetected: true,
                        patientOrder: patientOrder,
                        correctOrder: S.correctOrder,
                    });
                    setStatus('Checking...');
                    break;
                }

                case 'showResults': {
                    // data = { results: [{targetIndex, correct: true/false}, ...] }
                    const duration = data.durationSeconds || 3;
                    S.correctOrder.forEach(targetIdx => {
                        const marker = document.getElementById('shape' + targetIdx);
                        marker.setAttribute('visible', 'true');
                        const res = data.results.find(r => r.targetIndex === targetIdx);
                        if (res) {
                            const tint = res.correct ? '#FFFFFF' : '#FF0000';
                            // Add outline ring to indicate correct/wrong
                            const ring = document.createElement('a-torus');
                            ring.setAttribute('radius', '0.09');
                            ring.setAttribute('radius-tubular', '0.008');
                            ring.setAttribute('color', tint);
                            ring.setAttribute('position', '0 0.12 0');
                            ring.setAttribute('rotation', '90 0 0');
                            ring.className = 'result-ring';
                            marker.appendChild(ring);
                        }
                    });
                    setStatus(data.accuracyPercent + '% correct');
                    setTimeout(() => {
                        hideAllShapes();
                        document.querySelectorAll('.result-ring').forEach(r => r.remove());
                        Bridge.send('resultsHidden');
                    }, duration * 1000);
                    break;
                }

                case 'reset': {
                    hideAllShapes();
                    document.querySelectorAll('.result-ring').forEach(r => r.remove());
                    document.getElementById('silhouettes').innerHTML = '';
                    S.activeShapeIds = [];
                    S.correctOrder = [];
                    setStatus('Reset');
                    break;
                }
            }
        };

        // ====== AR READY ======
        sceneEl.addEventListener('loaded', () => {
            console.log('[JS] Scene loaded');
        });
        sceneEl.addEventListener('arReady', () => {
            setStatus('AR Ready');
            Bridge.send('arReady');
        });
        sceneEl.addEventListener('arError', () => {
            setStatus('AR Error');
            Bridge.send('arError', { message: 'AR Error' });
        });
    </script>
</body>

</html>
