<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./aframe.min.js"></script>
    <script>
        // ===== Camera Quality Hook (تشخيص + حقنة قيود) =====
        (function () {
            const origGM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
            navigator.mediaDevices.getUserMedia = async function (constraints) {
                // ✅ الحقنة: نطلب 1080p + فوكس مستمر
                const injected = {
                    ...constraints,
                    video: {
                        ...(typeof constraints.video === 'object' ? constraints.video : {}),
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        advanced: [
                            { focusMode: 'continuous' },
                            { exposureMode: 'continuous' },
                            { whiteBalanceMode: 'continuous' },
                        ],
                    },
                };

                const stream = await origGM(injected);
                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                const caps = track.getCapabilities ? track.getCapabilities() : {};

                const info = {
                    requested: { width: 1920, height: 1080 },
                    actual: { width: settings.width, height: settings.height },
                    fps: settings.frameRate,
                    focusMode: settings.focusMode || 'n/a',
                    supportedFocus: caps.focusMode || 'n/a',
                    exposureMode: settings.exposureMode || 'n/a',
                    label: track.label,
                };

                // نرسل لـ Flutter للطباعة في الـ terminal
                if (window.FlutterApp && window.FlutterApp.postMessage) {
                    window.FlutterApp.postMessage(JSON.stringify({
                        event: 'cameraInfo', data: info
                    }));
                }
                console.log('[CAMERA] settings:', info);
                return stream;
            };
        })();
    </script>
    <script src="./mindar-image-aframe.prod.js" type="module"></script>
    <style>
        body {
            margin: 0;
        }

        .example-container {
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            font-family: sans-serif;
            font-size: 14px;
        }

        /* ===== شريط الـ silhouettes فوق ===== */
        #silhouettes {
            position: fixed;
            top: 16px;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 16px;
            pointer-events: none;
        }

        .chip {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 4px 10px;
        }

        .silhouette {
            font-size: 34px;
            line-height: 1.2;
            display: inline-block;
            filter: brightness(0);
            /* ✅ مؤقت: emojis سوداء — لحد ما تجهز PNGs */
        }

        /* لما تجهز صور الـ PNG السوداء، استبدل الـ span بـ img وفعّل ده:
        .silhouette-img { width: 48px; height: 48px; object-fit: contain; } */
    </style>
</head>

<body>
    <div id="status">Status: starting…</div>
    <div id="silhouettes"></div>
    <div class="example-container">
        <!-- ✅ default = hard (5 targets) — الـ JS بيعدّل maxTrack حسب المستوى قبل بدء التحميل -->
        <a-scene
            mindar-image="imageTargetSrc: ./markers/shapematch_markers.mind; autoStart: true; maxTrack: 5; uiLoading: no; uiScanning: no; uiError: no;"
            embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

            <a-assets>
                <a-asset-item id="starModel" src="./shapes/star.glb"></a-asset-item>
                <a-asset-item id="arrowModel" src="./shapes/arrow.glb"></a-asset-item>
                <a-asset-item id="catModel" src="./shapes/cat.glb"></a-asset-item>
                <a-asset-item id="dogModel" src="./shapes/dog.glb"></a-asset-item>
                <a-asset-item id="diamondModel" src="./shapes/diamond.glb"></a-asset-item>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity light="type: ambient; intensity: 0.7"></a-entity>
            <a-entity light="type: directional; intensity: 1.2" position="1 2 2"></a-entity>

            <a-entity id="target0" mindar-image-target="targetIndex: 0">
                <a-entity id="shape0" visible="false"></a-entity>
            </a-entity>
            <a-entity id="target1" mindar-image-target="targetIndex: 1">
                <a-entity id="shape1" visible="false"></a-entity>
            </a-entity>
            <a-entity id="target2" mindar-image-target="targetIndex: 2">
                <a-entity id="shape2" visible="false"></a-entity>
            </a-entity>
            <a-entity id="target3" mindar-image-target="targetIndex: 3">
                <a-entity id="shape3" visible="false"></a-entity>
            </a-entity>
            <a-entity id="target4" mindar-image-target="targetIndex: 4">
                <a-entity id="shape4" visible="false"></a-entity>
            </a-entity>
        </a-scene>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const TEST_MODE = true;   // ← false لما تخلص الاختبارات (بيوقف المؤقتات والإخفاء)

        // ✅ طبقة التوجيه: لو بكرة عملت ملف مصغّر لمستوى، عدّل سطره هنا بس
        const MIND_FILES = {
            easy: { src: './markers/shapematch_markers.mind', maxTrack: 3 },
            medium: { src: './markers/shapematch_markers.mind', maxTrack: 4 },
            hard: { src: './markers/shapematch_markers.mind', maxTrack: 5 },
        };

        // ✅ عقد الربط: الترتيب هنا = targetIndex = ترتيب kAllShapeIds في Flutter
        const SHAPE_DEFS = [
            { id: 'star', assetId: 'starModel', emoji: '⭐', scale: 0.3, y: 0.10, rotation: '180 0 0' },
            { id: 'arrow', assetId: 'arrowModel', emoji: '➡️', scale: 0.6, y: 0.10, rotation: '180 0 0' },
            { id: 'cat', assetId: 'catModel', emoji: '🐱', scale: 1, y: 0.10, rotation: '0 150 0' },
            { id: 'dog', assetId: 'dogModel', emoji: '🐶', scale: 1, y: 0.10, rotation: '0 0 0' },
            { id: 'diamond', assetId: 'diamondModel', emoji: '💎', scale: 0.6, y: 0.10, rotation: '0 0 0' },
        ];

        const Bridge = {
            send(event, data) {
                if (window.FlutterApp && window.FlutterApp.postMessage) {
                    window.FlutterApp.postMessage(JSON.stringify({ event, data: data || {} }));
                }
            },
        };

        const setStatus = (t) => {
            document.getElementById('status').textContent = 'Status: ' + t;
            console.log('[STATUS] ' + t);
        };

        // ============================================================
        // STATE
        // ============================================================
        let S = {
            sequence: [],     // ترتيب الأشكال المطلوب (silhouettes)
            assignment: [],   // [{target, shape}] التوزيع العشوائي
            correctOrder: [], // targetIndex لكل موقع في الـ sequence
            showing: false,
        };
        const tracked = { 0: false, 1: false, 2: false, 3: false, 4: false };

        const sceneEl = document.querySelector('a-scene');

        // ===== المستوى من الـ URL → maxTrack (نفس الملف الواحد) =====
        const level = new URLSearchParams(window.location.search).get('level') || 'hard';
        const mindCfg = MIND_FILES[level] || MIND_FILES.hard;
        sceneEl.setAttribute('mindar-image',
            'imageTargetSrc: ' + mindCfg.src +
            '; autoStart: true; maxTrack: ' + mindCfg.maxTrack +
            '; uiLoading: no; uiScanning: no; uiError: no;');
        console.log('[JS] level=' + level + ' mind=' + mindCfg.src + ' maxTrack=' + mindCfg.maxTrack);

        // ============================================================
        // HELPERS
        // ============================================================
        function shapeDefById(id) {
            return SHAPE_DEFS.find(d => d.id === id);
        }

        function renderSilhouettes(shapeIds) {
            const container = document.getElementById('silhouettes');
            container.innerHTML = '';
            shapeIds.forEach(id => {
                const def = shapeDefById(id);
                const chip = document.createElement('span');
                chip.className = 'chip';
                const span = document.createElement('span');
                span.className = 'silhouette';
                span.textContent = def ? def.emoji : '?';
                chip.appendChild(span);
                container.appendChild(chip);
            });
        }

        function buildShape(def) {
            const el = document.createElement('a-entity');
            el.innerHTML = '<a-entity gltf-model="#' + def.assetId +
                '" scale="' + def.scale + ' ' + def.scale + ' ' + def.scale +
                '" rotation="' + (def.rotation || '0 0 0') + '"></a-entity>';
            el.setAttribute('position', '0 ' + def.y + ' 0');
            return el;
        }

        function clearAllShapes() {
            for (let i = 0; i < 5; i++) {
                const el = document.getElementById('shape' + i);
                if (el) { el.innerHTML = ''; el.setAttribute('visible', 'false'); }
            }
            document.querySelectorAll('.result-ring').forEach(r => r.remove());
        }

        function showActiveShapes() {
            S.assignment.forEach(item => {
                const el = document.getElementById('shape' + item.target);
                if (el) el.setAttribute('visible', 'true');
            });
            S.showing = true;
        }

        function hideActiveShapes() {
            S.assignment.forEach(item => {
                const el = document.getElementById('shape' + item.target);
                if (el) el.setAttribute('visible', 'false');
            });
            S.showing = false;
        }

        function collectCardPositions() {
            const results = [];
            S.correctOrder.forEach(t => {
                if (tracked[t]) {
                    const worldPos = new AFRAME.THREE.Vector3();
                    document.getElementById('target' + t).object3D.getWorldPosition(worldPos);
                    results.push({ targetIndex: t, worldX: worldPos.x, detected: true });
                } else {
                    results.push({ targetIndex: t, worldX: null, detected: false });
                }
            });
            return results;
        }

        // ============================================================
        // COMMANDS FROM FLUTTER (العقد النهائي)
        // ============================================================
        window.receiveFromFlutter = function (command, data) {
            switch (command) {
                case 'startRound': {
                    S.sequence = data.sequence || [];
                    S.assignment = data.assignment || [];
                    S.correctOrder = data.correctOrder || [];

                    clearAllShapes();
                    S.assignment.forEach(item => {
                        const def = shapeDefById(item.shape);
                        const marker = document.getElementById('shape' + item.target);
                        if (def && marker) marker.appendChild(buildShape(def));
                    });

                    renderSilhouettes(S.sequence);
                    setStatus('Round ready');
                    Bridge.send('roundReady');

                    if (TEST_MODE) showActiveShapes();   // ✅ اختبار: أشكال ظاهرة دايمًا
                    break;
                }

                case 'showPeek': {
                    showActiveShapes();
                    setStatus('Look! Memorize...');
                    if (!TEST_MODE) {
                        setTimeout(() => {
                            hideActiveShapes();
                            Bridge.send('peekEnded');
                        }, (data.durationSeconds || 4) * 1000);
                    } else {
                        Bridge.send('peekEnded');
                    }
                    break;
                }

                case 'check': {
                    const cards = collectCardPositions();
                    const missing = cards.filter(c => !c.detected).length;
                    if (missing > 0) {
                        Bridge.send('checkResult', { allDetected: false, missingCount: missing });
                        setStatus(missing + ' card(s) not visible');
                        return;
                    }
                    cards.sort((a, b) => a.worldX - b.worldX);
                    Bridge.send('checkResult', {
                        allDetected: true,
                        patientOrder: cards.map(c => c.targetIndex),
                    });
                    setStatus('Checking...');
                    break;
                }

                case 'showResults': {
                    showActiveShapes();
                    (data.results || []).forEach(res => {
                        const marker = document.getElementById('shape' + res.targetIndex);
                        if (!marker) return;
                        const ring = document.createElement('a-torus');
                        ring.setAttribute('radius', '0.09');
                        ring.setAttribute('radius-tubular', '0.008');
                        ring.setAttribute('color', res.correct ? '#FFFFFF' : '#FF0000');
                        ring.setAttribute('position', '0 0.10 0');
                        ring.setAttribute('rotation', '90 0 0');
                        ring.classList.add('result-ring');
                        marker.appendChild(ring);
                    });
                    setStatus((data.accuracyPercent || 0) + '% correct');

                    if (!TEST_MODE) {
                        setTimeout(() => {
                            hideActiveShapes();
                            document.querySelectorAll('.result-ring').forEach(r => r.remove());
                            Bridge.send('resultsHidden');
                        }, (data.durationSeconds || 3) * 1000);
                    } else {
                        setStatus('TEST: results shown — press Reset for new round');
                    }
                    break;
                }

                case 'reset': {
                    clearAllShapes();
                    S.sequence = []; S.assignment = []; S.correctOrder = [];
                    document.getElementById('silhouettes').innerHTML = '';
                    setStatus('Reset');
                    break;
                }
            }
        };

        // ============================================================
        // EVENTS
        // ============================================================
        sceneEl.addEventListener('loaded', () => {
            for (let i = 0; i < 5; i++) {
                const t = document.getElementById('target' + i);
                if (!t) continue;
                t.addEventListener('targetFound', () => { tracked[i] = true; });
                t.addEventListener('targetLost', () => { tracked[i] = false; });
            }
            console.log('[JS] scene loaded, tracking listeners ready');
        });

        sceneEl.addEventListener('arReady', () => {
            setStatus('AR Ready');
            Bridge.send('arReady');
        });
        sceneEl.addEventListener('arError', () => {
            setStatus('AR Error');
            Bridge.send('arError', { message: 'AR Error' });
        });
    </script>
</body>

</html>
