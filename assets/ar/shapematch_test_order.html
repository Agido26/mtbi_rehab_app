<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js" type="module"></script>
    <style>
        body {
            margin: 0;
        }

        .example-container {
            overflow: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="status">وجّه الكاميرا على كل بطاقة وسجّل اللون اللي يظهر فوقها</div>
    <div class="example-container">
        <a-scene
            mindar-image="imageTargetSrc: ./markers/shapematch_markers.mind; autoStart: true; maxTrack: 5; uiLoading: no; uiScanning: no; uiError: no;"
            embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-plane rotation="-90 0 0" position="0 0.01 0" width="0.5" height="0.5" color="#E53935"
                    opacity="0.9"></a-plane>
                <a-text value="0" rotation="-90 0 0" position="0 0.02 0" align="center" color="#FFFFFF"
                    width="0.3"></a-text>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 1">
                <a-plane rotation="-90 0 0" position="0 0.01 0" width="0.5" height="0.5" color="#FDD835"
                    opacity="0.9"></a-plane>
                <a-text value="1" rotation="-90 0 0" position="0 0.02 0" align="center" color="#000000"
                    width="0.3"></a-text>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 2">
                <a-plane rotation="-90 0 0" position="0 0.01 0" width="0.5" height="0.5" color="#43A047"
                    opacity="0.9"></a-plane>
                <a-text value="2" rotation="-90 0 0" position="0 0.02 0" align="center" color="#FFFFFF"
                    width="0.3"></a-text>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 3">
                <a-plane rotation="-90 0 0" position="0 0.01 0" width="0.5" height="0.5" color="#E91E63"
                    opacity="0.9"></a-plane>
                <a-text value="3" rotation="-90 0 0" position="0 0.02 0" align="center" color="#FFFFFF"
                    width="0.3"></a-text>
            </a-entity>
            <a-entity mindar-image-target="targetIndex: 4">
                <a-plane rotation="-90 0 0" position="0 0.01 0" width="0.5" height="0.5" color="#1E88E5"
                    opacity="0.9"></a-plane>
                <a-text value="4" rotation="-90 0 0" position="0 0.02 0" align="center" color="#FFFFFF"
                    width="0.3"></a-text>
            </a-entity>
        </a-scene>
    </div>
</body>

</html>
<script>
    const setStatus = (t) => {
        document.getElementById('status').textContent = 'Status: ' + t;
        console.log('[STATUS] ' + t);
    };
    const setTrackInfo = (t) => {
        document.getElementById('trackInfo').textContent = t;
    };

    const sceneEl = document.querySelector('a-scene');
    const names = ['ماركر 1 (كورة حمرا)', 'ماركر 2 (صندوق أزرق)'];
    const tracked = { 0: false, 1: false };

    function updateInfo() {
        const lines = [];
        for (let i = 0; i < 2; i++) {
            lines.push(names[i] + ': ' + (tracked[i] ? '✅ متتبع' : '⬜ مش متتبع'));
        }
        setTrackInfo(lines.join('   |   '));
    }

    sceneEl.addEventListener('loaded', () => {
        for (let i = 0; i < 2; i++) {
            const t = document.getElementById('target' + i);
            if (!t) continue;
            t.addEventListener('targetFound', () => { tracked[i] = true; updateInfo(); });
            t.addEventListener('targetLost', () => { tracked[i] = false; updateInfo(); });
        }
        updateInfo();
    });

    sceneEl.addEventListener('arReady', () => { setStatus('AR Ready'); });
    sceneEl.addEventListener('arError', () => { setStatus('AR Error'); });
</script>
</body>

</html>
