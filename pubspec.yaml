name: mtbi_rehab_app
description: AR rehabilitation app for mild traumatic brain injury patients

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.9.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  camera: ^0.11.0+2
  permission_handler: ^11.4.0
  webview_flutter: ^4.10.0  # ADD THIS
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ar/  # This loads everything in the ar folder