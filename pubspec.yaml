name: mtbi_rehab_app
description: AR rehabilitation app for mild traumatic brain injury patients

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.9.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  # AR Core for Android
  arcore_flutter_plus: ^1.0.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true